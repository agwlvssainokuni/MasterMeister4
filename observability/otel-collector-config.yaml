receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  # Prometheusのpullスクレイプ用にメトリクスを公開する(prometheus.ymlがこのエンドポイントを
  # スクレイプする)。アプリからはOTLP pushのみで完結させ、直接Prometheusを意識させない。
  prometheus:
    endpoint: 0.0.0.0:8889
  # Loki 3.xはOTLPログを/otlp/v1/logsでネイティブ受信できるため、専用エクスポータ変換は不要
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki]
