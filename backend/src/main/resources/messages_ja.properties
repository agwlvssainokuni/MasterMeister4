# UNIT-01: i18n基盤の雛形。各ユニットの実装時にメッセージキーを追加する。

# UNIT-02: APIエラーメッセージ（BR-API-01）。キーは error.<code>
error.AUTH_INVALID_CREDENTIALS=メールアドレスまたはパスワードが正しくありません
error.AUTH_ACCOUNT_LOCKED=ログイン試行回数が上限に達したため、一時的にロックされています。しばらくしてから再度お試しください
error.AUTH_REFRESH_TOKEN_INVALID=セッションが無効です。再度ログインしてください
error.REGISTRATION_TOKEN_EXPIRED=登録用リンクの有効期限が切れています
error.REGISTRATION_TOKEN_INVALID=登録用リンクが無効です
error.PASSWORD_TOO_SHORT=パスワードは{0}文字以上で入力してください
error.PASSWORD_COMPROMISED=このパスワードは既知の漏えいパスワードリストに含まれているため使用できません
error.USER_STATE_TRANSITION_INVALID=対象ユーザの現在の状態ではこの操作を行えません
error.VALIDATION_ERROR=入力内容に誤りがあります
error.INTERNAL_SERVER_ERROR=予期しないエラーが発生しました。しばらくしてから再度お試しください

# UNIT-03: RDBMSセットアップ
error.RDBMS_CONNECTION_NOT_FOUND=指定された接続情報が見つかりません
error.SCHEMA_IMPORT_FAILED=スキーマ取込に失敗しました
error.SCHEMA_NOT_IMPORTED=スキーマがまだ取り込まれていません

# UNIT-04: アクセス制御
error.GROUP_NOT_FOUND=指定されたグループが見つかりません
error.GROUP_NAME_DUPLICATE=同じ名前のグループが既に存在します
error.GROUP_MEMBERSHIP_DUPLICATE=このユーザは既に当該グループに所属しています
error.USER_NOT_FOUND=指定されたユーザが見つかりません
error.PERMISSION_YAML_IMPORT_REJECTED=インポートを拒否しました: {0}

# UNIT-05: マスタメンテナンス
error.INVALID_QUERY_CONDITION=WHERE句/ORDER BY句の入力内容に誤りがあります
error.BATCH_SIZE_EXCEEDED=一括反映は{0}件までです
error.MASTER_DATA_TABLE_NOT_ACCESSIBLE=指定されたテーブル/ビューが見つかりません

# UNIT-06: クエリ保存・実行
error.QUERY_SCHEMA_NOT_ACCESSIBLE=指定されたスキーマにはアクセスできません
error.NON_READ_ONLY_QUERY=SQLは単一のSELECT文である必要があります
error.SAVED_QUERY_NOT_ACCESSIBLE=指定された保存クエリが見つかりません
error.QUERY_EXECUTION_TIMEOUT=クエリの実行がタイムアウトしました
error.QUERY_RESULT_SIZE_EXCEEDED=結果件数が上限（{0}件）を超えています。ページングを有効にしてください
