# トレースログ(TraceAspect、reference/trace参照)はTRACEレベル時のみ出力される。
# CustomizableTraceInterceptorはメソッド引数・戻り値をそのままログ出力するため、
# 認証関連の処理ではパスワード平文・JWTトークンがログに残る（SECURITY-03、requirements.md §6.3に
# 抵触しうる）。このためデフォルトではTRACEを無効化し（root/cherry.mastermeisterともにINFO）、
# トラブルシューティング等で意図的に有効化する場合のみ環境変数で明示的にTRACEへ切り替える運用とする。
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger - %msg%n%xEx"
  level:
    root: ${MM_LOGGING_LEVEL_ROOT:WARN}
    cherry.mastermeister: ${MM_LOGGING_LEVEL_APP:INFO}

spring:
  application:
    name: mastermeister
  web:
    locale: ja
    locale-resolver: accept_header

  datasource:
    url: jdbc:h2:file:${MM_APP_DATASOURCE_PATH:./data/mastermeister}
    driver-class-name: org.h2.Driver
    username: ${MM_APP_DATASOURCE_USERNAME:sa}
    password: ${MM_APP_DATASOURCE_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  cache:
    type: caffeine
    cache-names: effectivePermission
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=30m

  mail:
    host: ${MM_APP_MAIL_HOST:localhost}
    port: ${MM_APP_MAIL_PORT:1025}
    username: ${MM_APP_MAIL_USERNAME:}
    password: ${MM_APP_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MM_APP_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MM_APP_MAIL_SMTP_STARTTLS:false}

server:
  port: ${SERVER_PORT:8080}

mm:
  app:
    jwt:
      secret: ${MM_APP_JWT_SECRET:}
      access-token-expiry: ${MM_APP_JWT_ACCESS_TOKEN_EXPIRY:PT10M}
      refresh-token-expiry: ${MM_APP_JWT_REFRESH_TOKEN_EXPIRY:P1D}
    password:
      bcrypt-strength: ${MM_APP_PASSWORD_BCRYPT_STRENGTH:10}
      min-length: ${MM_APP_PASSWORD_MIN_LENGTH:8}
    login-attempt:
      max-failures: ${MM_APP_LOGIN_ATTEMPT_MAX_FAILURES:5}
      lock-duration: ${MM_APP_LOGIN_ATTEMPT_LOCK_DURATION:PT15M}
    user-registration:
      token-expiry: ${MM_APP_USER_REGISTRATION_TOKEN_EXPIRY:PT3H}
      rate-limit-max-requests: ${MM_APP_USER_REGISTRATION_RATE_LIMIT_MAX_REQUESTS:3}
      rate-limit-window: ${MM_APP_USER_REGISTRATION_RATE_LIMIT_WINDOW:PT1H}
    admin-bootstrap:
      email: ${MM_APP_ADMIN_BOOTSTRAP_EMAIL:}
      password: ${MM_APP_ADMIN_BOOTSTRAP_PASSWORD:}
    frontend:
      base-url: ${MM_APP_FRONTEND_BASE_URL:http://localhost:5173}
    datasource:
      path: ${MM_APP_DATASOURCE_PATH:./data/mastermeister}
    mail:
      from: ${MM_APP_MAIL_FROM:no-reply@mastermeister.example}
    rdbms:
      encryption-keys: ${MM_APP_RDBMS_ENCRYPTION_KEYS:}
    masterdata:
      batch-max-size: ${MM_APP_MASTERDATA_BATCH_MAX_SIZE:1000}
    audit:
      bulk-access-threshold: ${MM_APP_AUDIT_BULK_ACCESS_THRESHOLD:100}
    query:
      execution-timeout-seconds: ${MM_APP_QUERY_EXECUTION_TIMEOUT_SECONDS:30}
      max-result-rows: ${MM_APP_QUERY_MAX_RESULT_ROWS:10000}
    trace:
      use-dynamic-logger: ${MM_APP_TRACE_USE_DYNAMIC_LOGGER:true}
      hide-proxy-class-names: ${MM_APP_TRACE_HIDE_PROXY_CLASS_NAMES:true}
      log-exception-stack-trace: ${MM_APP_TRACE_LOG_EXCEPTION_STACK_TRACE:true}
      enter-message: "ENTER $[targetClassShortName]#$[methodName]($[arguments])"
      exit-message: "EXIT  $[targetClassShortName]#$[methodName](): $[returnValue]"
      exception-message: "EXCEPTION $[targetClassShortName]#$[methodName](): $[exception]"

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# health/infoのみ未認証で公開する（SecurityConfigで/actuator/**への認可ルールを設定、
# それ以外のエンドポイントはADMINロール必須）。詳細情報の露出(env・beans・heapdump等)を
# 抑えるため、公開するエンドポイントは最小限に絞る。
#
# OpenTelemetry(トレース・メトリクス・ログのOTLPエクスポート、observability/docker-compose.yml参照)は
# デフォルトで無効(既存環境・テスト・CIへの影響を避けるため)。有効化する場合はMM_TRACING_ENABLED=true・
# MM_OTLP_METRICS_ENABLED=true・MM_OTLP_LOGGING_ENABLED=trueを設定する(observability/README.md参照)。
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN
  tracing:
    export:
      enabled: ${MM_TRACING_ENABLED:false}
    sampling:
      probability: ${MM_TRACING_SAMPLING_PROBABILITY:1.0}
  logging:
    export:
      otlp:
        enabled: ${MM_OTLP_LOGGING_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${MM_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
    logging:
      export:
        otlp:
          endpoint: ${MM_OTLP_LOGGING_ENDPOINT:http://localhost:4318/v1/logs}
  otlp:
    metrics:
      export:
        enabled: ${MM_OTLP_METRICS_ENABLED:false}
        url: ${MM_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
        step: ${MM_OTLP_METRICS_STEP:15s}
