name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ユーザー指示: タグのバージョンとbuild.gradle.ktsのversionが異なる場合は
      # リリースを中断する。ビルド実行前にexit 1でジョブを失敗させる。
      - name: Verify tag matches project version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION="$(./gradlew :backend:properties -q | grep '^version:' | awk '{print $2}')"
          echo "Tag version: ${TAG_VERSION}"
          echo "Project version: ${PROJECT_VERSION}"
          if [ "${TAG_VERSION}" != "${PROJECT_VERSION}" ]; then
            echo "::error::Tag version (${TAG_VERSION}) does not match backend/build.gradle.kts version (${PROJECT_VERSION})"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build release WAR
        run: ./gradlew bootWar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: backend/build/libs/*.war
